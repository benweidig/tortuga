name: Go package

on: [ push, pull_request ]

jobs:
  ci:
    name: "Run CI"
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macOS-latest
        - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: ^1.24

    - name: "Testing"
      run: "go test ./..."

    - name: "Vetting"
      run: "go vet ./..."

    - name: "StaticCheck"
      uses: dominikh/staticcheck-action@fe1dd0c3658873b46f8c9bb3291096a617310ca6 # v1.3.1

      with:
        version: "latest"
        install-go: false
        cache-key: ${{ matrix.os }}

    - name: "Build"
      run: go build -v ./...
