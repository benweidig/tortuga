name: Go package

on: [ push, pull_request ]

jobs:
  ci:
    name: "Run CI"
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macOS-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.00.2

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: 1.26.1

    - name: "Testing"
      run: "go test ./..."

    - name: "Vetting"
      run: "go vet ./..."

    - name: "StaticCheck"
      uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1

      with:
        version: "latest"
        install-go: false
        cache-key: ${{ matrix.os }}

    - name: "Build"
      run: go build -v ./...
